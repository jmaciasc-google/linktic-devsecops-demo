# cloudbuild.yaml — 6-Step Agentic DevSecOps Pipeline for Linktic
# Project: jmaciasc (599979914124) | Region: us-central1
# Executes: Unit & Security Tests -> Wiz CLI IaC/Dir Scan -> CodeMender Diff/SARIF Gate
#           -> Docker Build & Push to Artifact Registry -> Wiz Container Scan -> Cloud Run Deploy

substitutions:
  _REGION: "us-central1"
  _AR_REPO: "linktic-devsecops"
  _SERVICE_NAME: "linktic-sgda-portal"
  _DEFAULT_MODE: "v2-secure"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"

steps:
  # ==========================================================================
  # STEP 1: Functional & Security Unit Tests (v1-vulnerable PoC vs v2-secure Block)
  # ==========================================================================
  - id: "unit-tests"
    name: "python:3.11-slim"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        echo "🧪 [Step 1/6] Installing dependencies and running Pytest security suite..."
        pip install --no-cache-dir -q -r requirements.txt
        pytest tests/test_app_and_security.py -v

  # ==========================================================================
  # STEP 2: Shift-Left Wiz CLI IaC & Secret Governance Scan (go/wiz-adatest)
  # ==========================================================================
  - id: "wizcli-iac-and-dir-scan"
    name: "python:3.11-slim"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        echo "🛡️ [Step 2/6] Running Wiz CLI IaC (Terraform) & Directory Secret Scan..."
        bash scripts/demo_cli_runner.sh wiz-iac-scan
        bash scripts/demo_cli_runner.sh wiz-dir-scan

  # ==========================================================================
  # STEP 3: CodeMender Diff Scan, Sandbox Exploit PoC Verification & SARIF Gate
  # ==========================================================================
  - id: "codemender-diff-sarif-gate"
    name: "python:3.11-slim"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        echo "🤖 [Step 3/6] Running Google CodeMender (cm) Verification & SARIF Security Gate..."
        bash scripts/demo_cli_runner.sh cm-find
        bash scripts/demo_cli_runner.sh cm-verify
        bash scripts/demo_cli_runner.sh cm-fix
        bash scripts/demo_cli_runner.sh cm-report
        bash scripts/demo_cli_runner.sh cm-wiz-triage
        python3 -c '
        import json, sys
        with open("artifacts/results.sarif") as f:
            sarif = json.load(f)
        results = sarif["runs"][0]["results"]
        unfixed = [r["ruleId"] for r in results if r.get("properties", {}).get("status") != "FIXED_AND_VERIFIED"]
        print(f"[SARIF Gate] Verified findings: {len(results)} | Unfixed blockers: {len(unfixed)}")
        if unfixed:
            sys.exit(1)
        '

  # ==========================================================================
  # STEP 4: Build Hardened Non-Root Container & Push to Artifact Registry
  # ==========================================================================
  - id: "docker-build-and-push"
    name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        IMAGE_URI="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}"
        echo "📦 [Step 4/6] Building hardened container image (USER appuser 10001): $${IMAGE_URI}:latest"
        docker build -t "$${IMAGE_URI}:latest" -t "$${IMAGE_URI}:${BUILD_ID}" .
        docker push "$${IMAGE_URI}:latest"
        docker push "$${IMAGE_URI}:${BUILD_ID}"

  # ==========================================================================
  # STEP 5: Wiz CLI Container Image & Runtime Blast Radius Gate
  # ==========================================================================
  - id: "wizcli-container-scan"
    name: "python:3.11-slim"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        echo "🔍 [Step 5/6] Auditing container image & non-root policy with Wiz CLI..."
        bash scripts/demo_cli_runner.sh wiz-docker-scan

  # ==========================================================================
  # STEP 6: Deploy Hardened Service (v2-secure + Model Armor) to Cloud Run
  # ==========================================================================
  - id: "deploy-cloud-run"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        IMAGE_URI="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:latest"
        echo "🚀 [Step 6/6] Deploying ${_SERVICE_NAME} to Cloud Run (${_REGION}) in mode ${_DEFAULT_MODE}..."
        gcloud run deploy "${_SERVICE_NAME}" \
          --image="$${IMAGE_URI}" \
          --region="${_REGION}" \
          --project="${PROJECT_ID}" \
          --platform=managed \
          --port=8080 \
          --set-env-vars="DEFAULT_SECURITY_MODE=${_DEFAULT_MODE},GCP_PROJECT_ID=${PROJECT_ID},GCP_PROJECT_NUMBER=599979914124,AUTH_MODE=ADC_ZERO_API_KEYS" \
          --allow-unauthenticated || \
        gcloud run deploy "${_SERVICE_NAME}" \
          --image="$${IMAGE_URI}" \
          --region="${_REGION}" \
          --project="${PROJECT_ID}" \
          --platform=managed \
          --port=8080 \
          --set-env-vars="DEFAULT_SECURITY_MODE=${_DEFAULT_MODE},GCP_PROJECT_ID=${PROJECT_ID},GCP_PROJECT_NUMBER=599979914124,AUTH_MODE=ADC_ZERO_API_KEYS" \
          --no-allow-unauthenticated

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:latest"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:${BUILD_ID}"
